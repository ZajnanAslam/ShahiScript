<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShahiScript - The Royal Compiler</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
</head>
<body>
    <div class="glass-container">
        <header>
            <h1>ShahiScript</h1>
            <p>The Royal Decree Parsing Visualizer</p>
        </header>

        <main class="dashboard">
            <!-- PAGE 1: Code Editor & I/O -->
            <div id="page-code" class="view-page active" style="flex-direction: row; gap: 1rem;">
                <!-- Left: Code Editor -->
                <section class="editor-section panel" style="flex: 2; border-bottom: none; border-right: 1px solid var(--glass-border); padding-right: 1.5rem;">
                    <div class="panel-header">
                        <h2>Royal Decree (Code)</h2>
                        <div style="display: flex; gap: 1rem; align-items: center;">
                            <select id="example-select" class="regal-select">
                                <option value="custom">Custom Decree</option>
                                {% for name, content in examples.items() %}
                                <option value="{{ name }}">{{ name }}</option>
                                {% endfor %}
                            </select>
                            <button id="parse-btn" class="regal-btn">Issue Decree</button>
                            <button id="view-ast-btn" class="regal-btn outline">View Tree</button>
                        </div>
                    </div>
                    <textarea id="code-editor" spellcheck="false">Bismillah
    // Enter your code here
AllahHafiz</textarea>
                </section>

                <!-- Right: Standard Input & Execution Output -->
                <section class="io-section panel" style="flex: 1; border-bottom: none; padding-left: 0;">
                    <div class="panel-header">
                        <h2>Standard Input</h2>
                    </div>
                    <textarea id="std-input" placeholder="Type inputs here... (separated by newlines)" style="flex: 0.3; margin-bottom: 1.5rem; min-height: 80px;"></textarea>
                    
                    <div class="panel-header" style="margin-top: 0.5rem;">
                        <h2>Execution Output</h2>
                    </div>
                    <div id="execution-view" style="flex: 1; background: var(--code-bg); border: 1px solid var(--glass-border); border-radius: 8px; padding: 1rem; overflow: auto;">
                        <pre id="execution-output" style="color: #a6e22e; font-family: 'JetBrains Mono', monospace; margin: 0; white-space: pre-wrap; font-size: 1.1rem;"></pre>
                    </div>
                </section>
            </div>

            <!-- PAGE 2: Visualizer -->
            <div id="page-visualizer" class="view-page hidden">
                <section class="output-section panel">
                    <div class="panel-header">
                        <div class="tabs">
                            <button class="tab-btn" data-target="tokens-view">1. Lexer Tokens</button>
                            <button class="tab-btn active" data-target="ast-view">2. Abstract Syntax Tree</button>
                            <button class="tab-btn" data-target="tac-view">3. Intermediate Code</button>
                            <button class="tab-btn" data-target="asm-view">4. Target Code</button>
                        </div>
                        <button id="back-btn" class="regal-btn outline">Return to Decree</button>
                    </div>
                    
                    <div id="error-box" class="hidden"></div>
                    
                    <div class="tab-content active" id="ast-view">
                        <div id="ast-container"></div>
                    </div>
                    
                    <div class="tab-content" id="tokens-view">
                        <div id="tokens-container"></div>
                    </div>
                    
                    <div class="tab-content" id="tac-view">
                        <pre id="tac-container" style="color: #a6e22e; font-family: 'JetBrains Mono', monospace; font-size: 1.1rem; padding: 1rem; white-space: pre-wrap; margin: 0;"></pre>
                    </div>
                    
                    <div class="tab-content" id="asm-view">
                        <pre id="asm-container" style="color: #a6e22e; font-family: 'JetBrains Mono', monospace; font-size: 1.1rem; padding: 1rem; white-space: pre-wrap; margin: 0;"></pre>
                    </div>
                </section>
            </div>
        </main>
    </div>
    <script>
        const examplesData = {{ examples | tojson }};
    </script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
