<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShahiScript - The Royal Compiler</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
</head>
<body>
    <div class="glass-container">
        <header>
            <h1>ShahiScript</h1>
            <p>The Royal Decree Parsing Visualizer</p>
        </header>

        <main class="dashboard">
            <!-- PAGE 1: Code Editor -->
            <div id="page-code" class="view-page active">
                <section class="editor-section panel">
                    <div class="panel-header">
                        <h2>Royal Decree (Code)</h2>
                        <div style="display: flex; gap: 1rem; align-items: center;">
                            <select id="example-select" class="regal-select">
                                <option value="custom">Custom Decree</option>
                                {% for name, content in examples.items() %}
                                <option value="{{ name }}">{{ name }}</option>
                                {% endfor %}
                            </select>
                            <button id="parse-btn" class="regal-btn">Issue Decree</button>
                        </div>
                    </div>
                    <textarea id="code-editor" spellcheck="false">Bismillah
    adad daulat royalty = 100;
    agar (royalty > 50) phir
        farman "Welcome to the court";
    khatam;
AllahHafiz</textarea>
                </section>
            </div>

            <!-- PAGE 2: Visualizer -->
            <div id="page-visualizer" class="view-page hidden">
                <section class="output-section panel">
                    <div class="panel-header">
                        <div class="tabs">
                            <button class="tab-btn active" data-target="ast-view">Abstract Syntax Tree</button>
                            <button class="tab-btn" data-target="tokens-view">Lexer Tokens</button>
                        </div>
                        <button id="back-btn" class="regal-btn outline">Return to Decree</button>
                    </div>
                    
                    <div id="error-box" class="hidden"></div>
                    
                    <div class="tab-content active" id="ast-view">
                        <div id="ast-container"></div>
                    </div>
                    
                    <div class="tab-content" id="tokens-view">
                        <div id="tokens-container"></div>
                    </div>
                </section>
            </div>
        </main>
    </div>
    <script>
        const examplesData = {{ examples | tojson }};
    </script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
